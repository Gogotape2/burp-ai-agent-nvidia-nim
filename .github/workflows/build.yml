name: Build & PR Gate

# Phase 30 / SC1: "CI on every push and pull request" is read as pushes to main and pull requests
# targeting main. Every change reaches main through a pull request, so each change is checked before
# and after it merges.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Checkout and artifact upload need no write scope: least privilege for the third-party actions that run on push to main.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: ktlint check
        run: ./gradlew ktlintCheck --no-daemon
      - name: detekt (blocking)
        run: ./gradlew detekt --no-daemon

  pr-gate:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run both flavors' fast suites (test + fullTest)
        run: ./gradlew test fullTest -PexcludeHeavyTests=true --no-daemon

      # WR-11: the fast suite above runs with `-ea`, where an `assert`-based EDT guard is equally
      # green. This step is the only gate that runs the executor's door guard with assertions
      # DISABLED — the JVM shipped Burp actually runs, and the whole basis of D-03's choice of
      # `check` over `assert`. Run on all three OSes on purpose: REL-05 / SC1 is a threading
      # guarantee, and the cross-platform matrix is the one place an EDT difference between
      # platforms would surface at all.
      - name: Prove the EDT door guard still fires with JVM assertions DISABLED (REL-05 / SC1)
        run: ./gradlew edtGuardWithoutAssertionsTest --no-daemon

      # LIFE-01 / SC1 (Phase 33, D-13a): a full session through App (chat, both scanners, MCP with an
      # open SSE session), then unload, must leave no extension thread, no MCP listener and no
      # coroutine worker. App is a process-wide object and the production unload path shuts down the
      # shared coroutine dispatchers for good, so these tests run in their own Test task with one JVM
      # per class instead of inside `test`. Run on all three OSes: thread and socket teardown is
      # platform behaviour.
      - name: Prove nothing the extension started survives unload (LIFE-01 / SC1)
        run: ./gradlew unloadLeakTest --no-daemon

      # CI-01: the store JAR inspection runs here on all three OSes (Windows exercises the
      # path-separator handling of the derived full-only set). A failure names the offending entry
      # in this step's log and in the uploaded storeJarContentTest report.
      - name: Build both JARs and inspect the BApp Store JAR (CI-01 / SC2)
        run: ./gradlew bappJar fullJar storeJarContentTest --no-daemon

      - name: Upload JAR artifact (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: Custom-AI-Agent-${{ github.sha }}
          path: |
            build/libs/Custom-AI-Agent-*.jar
            build/libs/custom-ai-agent-bapp.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            build/reports/tests/fullTest/**
            build/test-results/fullTest/**
            build/reports/tests/storeJarContentTest/**
            build/test-results/storeJarContentTest/**
            build/reports/tests/unloadLeakTest/**
            build/test-results/unloadLeakTest/**

  coverage:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Only `test` may be finalized by jacocoTestReport, and the report is the only task that pulls
      # in :fullTest. If another Test task pulled in :test, :fullTest or :jacocoTestReport again, a
      # single invocation would run a whole suite twice (as the assertions-disabled step in pr-gate
      # once did). The dry run reads Gradle's real task graph. storeJarContentTest is a separate Test
      # task (it builds the store JAR) and must not pull in :test, :fullTest or :jacocoTestReport either,
      # and neither may unloadLeakTest (the App lifecycle tests, one JVM per class).
      - name: Only the test task pulls in the coverage report
        run: |
          plan="$(./gradlew edtGuardWithoutAssertionsTest nightlyRegressionTest nightlyRegressionFullTest storeJarContentTest unloadLeakTest --dry-run --no-daemon)"
          printf '%s\n' "$plan"
          for task in edtGuardWithoutAssertionsTest nightlyRegressionTest nightlyRegressionFullTest storeJarContentTest unloadLeakTest; do
            if ! grep -qx ":${task} SKIPPED" <<< "$plan"; then
              echo "::error::the dry run did not list :${task}, so the guard cannot read the task graph"
              exit 1
            fi
          done
          if grep -Eqx ':(test|fullTest|jacocoTestReport) SKIPPED' <<< "$plan"; then
            echo "::error::a Test task other than test pulls in :test, :fullTest or :jacocoTestReport"
            exit 1
          fi

      # The floors are full-suite floors: the fast suite (-PexcludeHeavyTests=true) misses the CLI
      # backend floors, so this job runs every test class. The report depends on fullTest, so this
      # step runs both suites and the floors measure main + full.
      - name: Full test suite and the coverage floors
        run: ./gradlew test jacocoTestCoverageVerification jacocoMcpTreeCoverageVerification --continue --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: build/reports/jacoco/test/**

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-full-suite-${{ github.sha }}
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            build/reports/tests/fullTest/**
            build/test-results/fullTest/**

  store-build:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and inspect the BApp Store JAR (CI-01)
        run: ./gradlew bappJar storeJarContentTest --no-daemon

      # The store JAR is the file BappManifest.bmf names as EntryPoint. storeJarContentTest (previous
      # step) rejects full-only and CLI content; this step proves the Montoya entry point is present.
      - name: Smoke-test BApp Store JAR
        run: |
          jar=build/libs/custom-ai-agent-bapp.jar
          if [ ! -f "$jar" ]; then
            echo "::error::expected the BApp Store JAR at $jar"
            exit 1
          fi
          javap -cp "$jar" com.six2dez.burp.aiagent.BurpAiAgentExtension | grep -F 'implements burp.api.montoya.BurpExtension'

      - name: Upload BApp Store JAR
        uses: actions/upload-artifact@v7
        with:
          name: Custom-AI-Agent-store-${{ github.sha }}
          path: build/libs/custom-ai-agent-bapp.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-store-${{ github.sha }}
          path: |
            build/reports/tests/storeJarContentTest/**
            build/test-results/storeJarContentTest/**
